name: Commit Message Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          printf '## Commit message lint\n\n' >> "$GITHUB_STEP_SUMMARY"
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          # Lint only commits introduced by this pull request.
          if npx --yes --package @commitlint/cli@19.8.1 -- commitlint \
            --config .github/workflows/.commitlintrc.cjs \
            --from="$BASE_SHA" \
            --to="$HEAD_SHA" 2>&1 | tee "$output_file"; then
            if [[ -s "$output_file" ]]; then
              printf 'Commit message lint passed with warnings.\n\n' \
                >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r line; do
                printf '    %s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
              done < "$output_file"
            else
              printf 'All pull request commit messages passed.\n' \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf 'Commit message lint failed.\n\n' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              printf '    %s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
            done < "$output_file"
            exit 1
          fi