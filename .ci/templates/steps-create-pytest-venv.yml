steps:
  - script: |
      cd $(Agent.TempDirectory)
      python3 -m venv pytest_venv
      source pytest_venv/bin/activate
      echo '##vso[task.setvariable variable=PYTEST_VENV]'$(realpath pytest_venv)
      python3 -m pip install -U pip
      pip3 install -r $(Build.SourcesDirectory)/ettus-rts/config/remote/streaming/requirements.txt
    displayName: Create pytest venv

