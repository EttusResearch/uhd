parameters:
- name: add_tests
  type: string
  default: "none"
- name: remove_tests
  type: string
  default: "none"
- name: skip_rule_checking
  type: boolean
  default: False
- name: custom_boost_version
  type: boolean
  default: false
- name: custom_boost_version_url
  type: string
  default: 'https://boostorg.jfrog.io/artifactory/main/release/1.76.0/source/boost_1_76_0.tar.bz2'
- name: release_binaries
  type: boolean
  default: false
- name: testLength
  type: string
  default: 'smoke'
- name: selected_streaming_tests
  type: string
  displayName: Streaming Tests Multi-Select (comma-separated)
  default: 'B206,B210,B310,X310_XG,X410_CG_400,X410_UC_200,X440_CG_400,X440_CG_1600'
- name: create_sbom
  type: boolean
  displayName: Create SBOMs
  default: true
- name: build_sdk
  type: boolean
  default: false
- name: cache_sstate
  type: boolean
  default: true
- name: build_e310_sg1
  type: boolean
  default: true
- name: build_e310_sg3
  type: boolean
  default: true
- name: build_e320
  type: boolean
  default: true
- name: build_n3xx
  type: boolean
  default: true
- name: build_x4xx
  type: boolean
  default: true
- name: ext_fpga
  type: boolean
  displayName: Use pipeline FPGA build
  default: true
- name: cmake_args
  type: string
  default: " "
- name: fpga_imgs_source
  type: string
  displayName: FPGA Images Source
  default: 'Mono Pipeline'
  values:
  - 'files.ettus.com (Public)'
  - 'Internal Repo'
  - 'Mono Pipeline'
  - 'Mono Pipeline PR'
  - 'FPGA Pipeline'
### FPGA parameters
## Optional parameters
# Run testbenches
- name: run_testbenches
  type: boolean
  default: true
# Option to ignore cached artifacts (if available) and perform
# a clean IP build.
- name: clean_ip_build
  type: boolean
  default: false
# Number of parallel jobs to use for IP build
- name: num_ip_jobs
  type: number
  default: 5
# Option to publish intermediate files
- name: publish_int_files
  type: boolean
  default: false
# Package and publish images
- name: package_and_publish_images
  type: boolean
  default: true
# Package access in the SDR server ('Internal' or 'Public')
- name: package_access
  type: string
  default: 'Internal'
# GRPC version used in the macos build
# make sure to align the definition with the grpc
# respository resource below
- name: grpc_version
  type: string
  default: "1.51.1"
