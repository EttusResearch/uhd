schema: rfnoc_modtool_args
module_name: duc
name: Digital Upconverter
description: |
  This block combines an integer resampler (interpolator) with a frequency
  shifter. It is often used directly before the radio block of a USRP to adapt
  center frequency (e.g., to provide an LO offset) and sampling rate.
version: "1.0"
rfnoc_version: "1.0"
chdr_width: 64
noc_id: 0xD0C00000

parameters:
  NUM_PORTS: 1
  NUM_HB: 3
  CIC_MAX_INTERP: 255
  # NIPC is calculated based on RF_BW, which is expected to be provided by the
  # parent image YAML file. The formula rounds NIPC up to the nearest power of
  # 2 that can support the given RF_BW, assuming each of the NIPC parallel
  # chains supports 200 MHz of RF bandwidth (with a corresponding sampling rate
  # of 250 MSps). If RF_BW is not provided or is zero, NIPC defaults to 1.
  NIPC: "${ 1 << ((-(-int(config.device.parameters.get('RF_BW', 200) // 200)) - 1).bit_length()) }"

clocks:
  - name: rfnoc_chdr
    freq: "[]"
  - name: rfnoc_ctrl
    freq: "[]"
  - name: ce
    freq: "[]"

control:
  fpga_iface: ctrlport
  interface_direction: slave
  fifo_depth: 64
  clk_domain: ce
  ctrlport:
    byte_mode: False
    timed: True
    has_status: False

data:
  fpga_iface: axis_data
  clk_domain: ce
  inputs:
    in:
      num_ports: NUM_PORTS
      item_width: 32
      nipc: NIPC
      info_fifo_depth: 32
      payload_fifo_depth: 32
      format: sc16
  outputs:
    out:
      num_ports: NUM_PORTS
      item_width: 32
      nipc: NIPC
      info_fifo_depth: 32
      payload_fifo_depth: 2**MTU
      sideband_at_end: True
      format: sc16

fpga_includes:
  - include: "$(LIB_DIR)/rfnoc/blocks/rfnoc_block_duc/Makefile.srcs"
    make_var: "$(RFNOC_BLOCK_DUC_SRCS)"
