syntax = "proto3";

package mpm_server;

// MPM Server service definition
service MpmServerService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc Reclaim(ReclaimRequest) returns (ReclaimResponse);
  rpc Unclaim(UnclaimRequest) returns (UnclaimResponse);
  rpc GetMpmCompatNumber(GetMpmCompatNumberRequest) returns (GetMpmCompatNumberResponse);
  rpc ListMethods(ListMethodsRequest) returns (ListMethodsResponse);

  rpc Init(InitRequest) returns (InitResponse); // timeout=MPMD_DEFAULT_INIT_TIMEOUT
  rpc ResetTimerAndMgr(ResetTimerAndMgrRequest) returns (ResetTimerAndMgrResponse); // timeout=MPMD_DEFAULT_INIT_TIMEOUT
  rpc UpdateComponent(UpdateComponentRequest) returns (UpdateComponentResponse); // timeout=MPMD_DEFAULT_INIT_TIMEOUT
  rpc ListUpdateableComponents(ListUpdateableComponentsRequest) returns (ListUpdateableComponentsResponse);
  rpc GetComponentInfo(GetComponentInfoRequest) returns (GetComponentInfoResponse);
  rpc GetLogBuf(GetLogBufRequest) returns (GetLogBufResponse);
  rpc GetDeviceInfo(GetDeviceInfoRequest) returns (GetDeviceInfoResponse); // timeout=MPMD_SHORT_RPC_TIMEOUT  (2000ms)
  rpc GetDboardInfo(GetDboardInfoRequest) returns (GetDboardInfoResponse);
  rpc GetInitStatus(GetInitStatusRequest) returns (GetInitStatusResponse); // timeout=MPMD_DEFAULT_INIT_TIMEOUT
  rpc GetDeviceId(GetDeviceIdRequest) returns (GetDeviceIdResponse);
  rpc SetDeviceId(SetDeviceIdRequest) returns (SetDeviceIdResponse); // timeout=MPMD_DEFAULT_INIT_TIMEOUT
  rpc SupportsFeature(SupportsFeatureRequest) returns (SupportsFeatureResponse);
  rpc ListActiveOverlays(ListActiveOverlaysRequest) returns (ListActiveOverlaysResponse);
  rpc ListAvailableOverlays(ListAvailableOverlaysRequest) returns (ListAvailableOverlaysResponse);
  rpc ListRequiredDtOverlays(ListRequiredDtOverlaysRequest) returns (ListRequiredDtOverlaysResponse);
  rpc OverlayApply(OverlayApplyRequest) returns (OverlayApplyResponse);
  rpc Deinit(DeinitRequest) returns (DeinitResponse);
  rpc TearDown(TearDownRequest) returns (TearDownResponse);
  rpc InitDboards(InitDboardsRequest) returns (InitDboardsResponse);
  rpc GetDeviceInfoDyn(GetDeviceInfoDynRequest) returns (GetDeviceInfoDynResponse);
  rpc GetPostResetArgs(GetPostResetArgsRequest) returns (GetPostResetArgsResponse);
  rpc GenerateDeviceInfo(GenerateDeviceInfoRequest) returns (GenerateDeviceInfoResponse);

  rpc GetNumTimekeepers(GetNumTimekeepersRequest) returns (GetNumTimekeepersResponse);
  rpc SetTickPeriod(SetTickPeriodRequest) returns (SetTickPeriodResponse);
  rpc GetTimekeeperTime(GetTimekeeperTimeRequest) returns (GetTimekeeperTimeResponse);
  rpc SetTimekeeperTime(SetTimekeeperTimeRequest) returns (SetTimekeeperTimeResponse);
  rpc SetTimeSource(SetTimeSourceRequest) returns (SetTimeSourceResponse); // timeout=MPMD_DEFAULT_LONG_TIMEOUT
  rpc GetTimeSource(GetTimeSourceRequest) returns (GetTimeSourceResponse);
  rpc GetTimeSources(GetTimeSourcesRequest) returns (GetTimeSourcesResponse);
  rpc SetClockSource(SetClockSourceRequest) returns (SetClockSourceResponse); // timeout=MPMD_DEFAULT_LONG_TIMEOUT
  rpc GetClockSource(GetClockSourceRequest) returns (GetClockSourceResponse);
  rpc GetClockSources(GetClockSourcesRequest) returns (GetClockSourcesResponse);
  rpc SetSyncSource(SetSyncSourceRequest) returns (SetSyncSourceResponse); // timeout=MPMD_DEFAULT_LONG_TIMEOUT
  rpc GetSyncSource(GetSyncSourceRequest) returns (GetSyncSourceResponse);
  rpc GetSyncSources(GetSyncSourcesRequest) returns (GetSyncSourcesResponse);
  rpc SetClockSourceOut(SetClockSourceOutRequest) returns (SetClockSourceOutResponse);
  rpc SetTriggerIo(SetTriggerIoRequest) returns (SetTriggerIoResponse);
  rpc GetClocks(GetClocksRequest) returns (GetClocksResponse);
  rpc Synchronize(SynchronizeRequest) returns (SynchronizeResponse);
  rpc AggregateSyncData(AggregateSyncDataRequest) returns (AggregateSyncDataResponse);
  rpc SetRefClkTuningWord(SetRefClkTuningWordRequest) returns (SetRefClkTuningWordResponse);
  rpc GetRefClkTuningWord(GetRefClkTuningWordRequest) returns (GetRefClkTuningWordResponse);
  rpc StoreRefClkTuningWord(StoreRefClkTuningWordRequest) returns (StoreRefClkTuningWordResponse);

  rpc GetMbSensors(GetMbSensorsRequest) returns (GetMbSensorsResponse);
  rpc GetMbSensor(GetMbSensorRequest) returns (GetMbSensorResponse); // timeout=MPMD_DEFAULT_INIT_TIMEOUT
  rpc GetRefLockSensor(GetRefLockSensorRequest) returns (GetRefLockSensorResponse);
  rpc GetGpsLockedSensor(GetGpsLockedSensorRequest) returns (GetGpsLockedSensorResponse);
  rpc GetFanSensor(GetFanSensorRequest) returns (GetFanSensorResponse);
  rpc GetTempSensor(GetTempSensorRequest) returns (GetTempSensorResponse);
  rpc GetFpgaTempSensor(GetFpgaTempSensorRequest) returns (GetFpgaTempSensorResponse);
  rpc GetInternalTempSensor(GetInternalTempSensorRequest) returns (GetInternalTempSensorResponse);
  rpc GetRfChannelATempSensor(GetRfChannelATempSensorRequest) returns (GetRfChannelATempSensorResponse);
  rpc GetRfChannelBTempSensor(GetRfChannelBTempSensorRequest) returns (GetRfChannelBTempSensorResponse);
  rpc GetMainPowerTempSensor(GetMainPowerTempSensorRequest) returns (GetMainPowerTempSensorResponse);
  rpc GetGpsTimeSensor(GetGpsTimeSensorRequest) returns (GetGpsTimeSensorResponse);
  rpc GetGpsTpvSensor(GetGpsTpvSensorRequest) returns (GetGpsTpvSensorResponse);
  rpc GetGpsSkySensor(GetGpsSkySensorRequest) returns (GetGpsSkySensorResponse);
  rpc GetGpsGpggaSensor(GetGpsGpggaSensorRequest) returns (GetGpsGpggaSensorResponse);

  rpc EnableFpGpio(EnableFpGpioRequest) returns (EnableFpGpioResponse);
  rpc EnableGps(EnableGpsRequest) returns (EnableGpsResponse);
  rpc SetFpGpioVoltage(SetFpGpioVoltageRequest) returns (SetFpGpioVoltageResponse);
  rpc GetFpGpioVoltage(GetFpGpioVoltageRequest) returns (GetFpGpioVoltageResponse);
  rpc GetRefClockFreq(GetRefClockFreqRequest) returns (GetRefClockFreqResponse);
  rpc SetRefClockFreq(SetRefClockFreqRequest) returns (SetRefClockFreqResponse);

  rpc GetGpioBanks(GetGpioBanksRequest) returns (GetGpioBanksResponse);
  rpc GetGpioSrcs(GetGpioSrcsRequest) returns (GetGpioSrcsResponse);
  rpc GetGpioSrc(GetGpioSrcRequest) returns (GetGpioSrcResponse);
  rpc SetGpioSrc(SetGpioSrcRequest) returns (SetGpioSrcResponse);

  rpc GetMbEeprom(GetMbEepromRequest) returns (GetMbEepromResponse);
  rpc SetMbEeprom(SetMbEepromRequest) returns (SetMbEepromResponse); // timeout=MPMD_DEFAULT_INIT_TIMEOUT
  rpc GetDbEeprom(GetDbEepromRequest) returns (GetDbEepromResponse);
  rpc SetDbEeprom(SetDbEepromRequest) returns (SetDbEepromResponse);

  rpc GetProtoVer(GetProtoVerRequest) returns (GetProtoVerResponse);
  rpc GetChdrWidth(GetChdrWidthRequest) returns (GetChdrWidthResponse);
  rpc GetChdrLinkTypes(GetChdrLinkTypesRequest) returns (GetChdrLinkTypesResponse);
  rpc GetChdrLinkOptions(GetChdrLinkOptionsRequest) returns (GetChdrLinkOptionsResponse);
  rpc GetChdrXportAdapters(GetChdrXportAdaptersRequest) returns (GetChdrXportAdaptersResponse);
  rpc AddRemoteChdrRoute(AddRemoteChdrRouteRequest) returns (AddRemoteChdrRouteResponse);

  rpc PopHostTasks(PopHostTasksRequest) returns (PopHostTasksResponse);

  rpc SetChannelMode(SetChannelModeRequest) returns (SetChannelModeResponse);
  rpc GetSensors(GetSensorsRequest) returns (GetSensorsResponse);
  rpc GetSensor(GetSensorRequest) returns (GetSensorResponse);
  rpc GetMasterClockRate(GetMasterClockRateRequest) returns (GetMasterClockRateResponse);
  rpc SetBwFilter(SetBwFilterRequest) returns (SetBwFilterResponse);
  rpc SetGain(SetGainRequest) returns (SetGainResponse);
  rpc SetAgc(SetAgcRequest) returns (SetAgcResponse);
  rpc SetAgcMode(SetAgcModeRequest) returns (SetAgcModeResponse);
  rpc SetCatalinaClockRate(SetCatalinaClockRateRequest) returns (SetCatalinaClockRateResponse);
  rpc SetActiveChains(SetActiveChainsRequest) returns (SetActiveChainsResponse);
  rpc CatalinaTune(CatalinaTuneRequest) returns (CatalinaTuneResponse);
  rpc SetDcOffsetAuto(SetDcOffsetAutoRequest) returns (SetDcOffsetAutoResponse);
  rpc SetTimingMode(SetTimingModeRequest) returns (SetTimingModeResponse);
  rpc SetIqBalanceAuto(SetIqBalanceAutoRequest) returns (SetIqBalanceAutoResponse);
  rpc GetFreq(GetFreqRequest) returns (GetFreqResponse);
  rpc DataPortLoopback(DataPortLoopbackRequest) returns (DataPortLoopbackResponse);
  rpc GetRssi(GetRssiRequest) returns (GetRssiResponse);
  rpc GetTemperature(GetTemperatureRequest) returns (GetTemperatureResponse);
  rpc GetFilterNames(GetFilterNamesRequest) returns (GetFilterNamesResponse);
  rpc OutputDigitalTestTone(OutputDigitalTestToneRequest) returns (OutputDigitalTestToneResponse);
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse);
  rpc GetRevisionString(GetRevisionStringRequest) returns (GetRevisionStringResponse);
  rpc GetSerial(GetSerialRequest) returns (GetSerialResponse);
  rpc GetAd9361LoLock(GetAd9361LoLockRequest) returns (GetAd9361LoLockResponse);
  rpc GetLoLockSensor(GetLoLockSensorRequest) returns (GetLoLockSensorResponse);
  rpc GetRxLoLockSensor(GetRxLoLockSensorRequest) returns (GetRxLoLockSensorResponse);
  rpc GetTxLoLockSensor(GetTxLoLockSensorRequest) returns (GetTxLoLockSensorResponse);
  rpc GetCatalinaTempSensor(GetCatalinaTempSensorRequest) returns (GetCatalinaTempSensorResponse);
  rpc GetRssiVal(GetRssiValRequest) returns (GetRssiValResponse);
  rpc GetRssiSensor(GetRssiSensorRequest) returns (GetRssiSensorResponse);
  rpc GetGainNames(GetGainNamesRequest) returns (GetGainNamesResponse);
  rpc GetRfFreqRange(GetRfFreqRangeRequest) returns (GetRfFreqRangeResponse);
  rpc GetBwFilterRange(GetBwFilterRangeRequest) returns (GetBwFilterRangeResponse);
  rpc GetClockRateRange(GetClockRateRangeRequest) returns (GetClockRateRangeResponse);
  rpc SetClockRate(SetClockRateRequest) returns (SetClockRateResponse);
  rpc Tune(TuneRequest) returns (TuneResponse);
  rpc SetDcOffset(SetDcOffsetRequest) returns (SetDcOffsetResponse);
  rpc SetIqBalance(SetIqBalanceRequest) returns (SetIqBalanceResponse);
  rpc SetFilter(SetFilterRequest) returns (SetFilterResponse);
  rpc GetUserEepromData(GetUserEepromDataRequest) returns (GetUserEepromDataResponse);
  rpc SetUserEepromData(SetUserEepromDataRequest) returns (SetUserEepromDataResponse);
  rpc UpdateRefClockFreq(UpdateRefClockFreqRequest) returns (UpdateRefClockFreqResponse);
  rpc InitRfic(InitRficRequest) returns (InitRficResponse);
  rpc TearDownRfic(TearDownRficRequest) returns (TearDownRficResponse);
  rpc ResetClock(ResetClockRequest) returns (ResetClockResponse);

  rpc SetFreq(SetFreqRequest) returns (SetFreqResponse);
  rpc GetGain(GetGainRequest) returns (GetGainResponse);
  rpc GetBandwidth(GetBandwidthRequest) returns (GetBandwidthResponse);
  rpc SetBandwidth(SetBandwidthRequest) returns (SetBandwidthResponse);
  rpc SetLoSource(SetLoSourceRequest) returns (SetLoSourceResponse);
  rpc GetLoSource(GetLoSourceRequest) returns (GetLoSourceResponse);
  rpc SetFir(SetFirRequest) returns (SetFirResponse);
  rpc GetFir(GetFirRequest) returns (GetFirResponse);
  rpc GetAd9371LoLock(GetAd9371LoLockRequest) returns (GetAd9371LoLockResponse);
  rpc GetLowbandLoLock(GetLowbandLoLockRequest) returns (GetLowbandLoLockResponse);
  rpc EnableRxLowbandLo(EnableRxLowbandLoRequest) returns (EnableRxLowbandLoResponse);
  rpc EnableTxLowbandLo(EnableTxLowbandLoRequest) returns (EnableTxLowbandLoResponse);
  rpc SetMasterClockRate(SetMasterClockRateRequest) returns (SetMasterClockRateResponse);

  rpc IsLoDistPresent(IsLoDistPresentRequest) returns (IsLoDistPresentResponse);
  rpc EnableLoExport(EnableLoExportRequest) returns (EnableLoExportResponse);
  rpc EnableLoOutput(EnableLoOutputRequest) returns (EnableLoOutputResponse);

  rpc DioGetSupportedVoltageLevels(DioGetSupportedVoltageLevelsRequest) returns (DioGetSupportedVoltageLevelsResponse);
  rpc DioSetVoltageLevel(DioSetVoltageLevelRequest) returns (DioSetVoltageLevelResponse);
  rpc DioGetVoltageLevel(DioGetVoltageLevelRequest) returns (DioGetVoltageLevelResponse);
  rpc DioSetExternalPower(DioSetExternalPowerRequest) returns (DioSetExternalPowerResponse);
  rpc DioGetExternalPowerState(DioGetExternalPowerStateRequest) returns (DioGetExternalPowerStateResponse);

  rpc DioSetPortMapping(DioSetPortMappingRequest) returns (DioSetPortMappingResponse);
  rpc DioSetPinDirections(DioSetPinDirectionsRequest) returns (DioSetPinDirectionsResponse);
  rpc SetDacMuxData(SetDacMuxDataRequest) returns (SetDacMuxDataResponse);
  rpc SetDacMuxEnable(SetDacMuxEnableRequest) returns (SetDacMuxEnableResponse);
  rpc SetupThreshold(SetupThresholdRequest) returns (SetupThresholdResponse);
  rpc SetCalibrationMode(SetCalibrationModeRequest) returns (SetCalibrationModeResponse);
  rpc GetCalFrozen(GetCalFrozenRequest) returns (GetCalFrozenResponse);
  rpc SetCalFrozen(SetCalFrozenRequest) returns (SetCalFrozenResponse);
  rpc RfdcSetNcoFreq(RfdcSetNcoFreqRequest) returns (RfdcSetNcoFreqResponse);
  rpc RfdcGetNcoFreq(RfdcGetNcoFreqRequest) returns (RfdcGetNcoFreqResponse);
  rpc SetLeds(SetLedsRequest) returns (SetLedsResponse);
  rpc EnableIqSwap(EnableIqSwapRequest) returns (EnableIqSwapResponse);
  rpc GetDboardSampleRate(GetDboardSampleRateRequest) returns (GetDboardSampleRateResponse);
  rpc GetDboardPrcRate(GetDboardPrcRateRequest) returns (GetDboardPrcRateResponse);
  rpc IsDbGpioIfcPresent(IsDbGpioIfcPresentRequest) returns (IsDbGpioIfcPresentResponse);
  rpc GetThresholdStatus(GetThresholdStatusRequest) returns (GetThresholdStatusResponse);
  rpc ConfigTxPath(ConfigTxPathRequest) returns (ConfigTxPathResponse);
  rpc GetTxPath(GetTxPathRequest) returns (GetTxPathResponse);
  rpc ConfigRxPath(ConfigRxPathRequest) returns (ConfigRxPathResponse);
  rpc GetRxPath(GetRxPathRequest) returns (GetRxPathResponse);
  rpc SetDataPath(SetDataPathRequest) returns (SetDataPathResponse);
  rpc GetCalCoefs(GetCalCoefsRequest) returns (GetCalCoefsResponse);
  rpc SetCalCoefs(SetCalCoefsRequest) returns (SetCalCoefsResponse);

  rpc GetFpgaAuxRefFreq(GetFpgaAuxRefFreqRequest) returns (GetFpgaAuxRefFreqResponse);
  rpc NsyncChangeInputSource(NsyncChangeInputSourceRequest) returns (NsyncChangeInputSourceResponse);
  rpc EnableEcpriClocks(EnableEcpriClocksRequest) returns (EnableEcpriClocksResponse);
  rpc ConfigRpllToNsync(ConfigRpllToNsyncRequest) returns (ConfigRpllToNsyncResponse);
  rpc PeekClkaux(PeekClkauxRequest) returns (PeekClkauxResponse);
  rpc ClkauxGetNsyncStatus0(ClkauxGetNsyncStatus0Request) returns (ClkauxGetNsyncStatus0Response);
  rpc ClkauxGetNsyncStatus1(ClkauxGetNsyncStatus1Request) returns (ClkauxGetNsyncStatus1Response);
  rpc DioSetGpioSrc(DioSetGpioSrcRequest) returns (DioSetGpioSrcResponse);
  rpc DioSetPinOutputs(DioSetPinOutputsRequest) returns (DioSetPinOutputsResponse);
  rpc DioGetPinInputs(DioGetPinInputsRequest) returns (DioGetPinInputsResponse);
  rpc DioStatus(DioStatusRequest) returns (DioStatusResponse);
  rpc PokeDb(PokeDbRequest) returns (PokeDbResponse);
  rpc PeekDb(PeekDbRequest) returns (PeekDbResponse);
  rpc PokeClkaux(PokeClkauxRequest) returns (PokeClkauxResponse);
  rpc PeekCtrlport(PeekCtrlportRequest) returns (PeekCtrlportResponse);
  rpc PokeCtrlport(PokeCtrlportRequest) returns (PokeCtrlportResponse);
  rpc PeekCpld(PeekCpldRequest) returns (PeekCpldResponse);
  rpc PokeCpld(PokeCpldRequest) returns (PokeCpldResponse);
  rpc PeekMb(PeekMbRequest) returns (PeekMbResponse);
  rpc PokeMb(PokeMbRequest) returns (PokeMbResponse);
  rpc PeekRfdc(PeekRfdcRequest) returns (PeekRfdcResponse);
  rpc PokeRfdc(PokeRfdcRequest) returns (PokeRfdcResponse);
}

// ==============================================================================
// Common/Reusable Message Types
// ==============================================================================

// A reusable string-to-string map wrapper (same as in rpc.proto)
message StringMap {
  map<string, string> data = 1;
}

// A reusable string-to-bytes map wrapper for EEPROM data
message BytesMap {
  map<string, bytes> data = 1;
}

// Sensor value map wrapper
message SensorValueMap {
  map<string, string> data = 1;
}

// Empty response for void functions
message EmptyResponse {}

// ==============================================================================
// Core Session & Device Management Messages
// ==============================================================================

message PingRequest {
    string data = 1;
}

message PingResponse {
    string data = 1;
}

// Claim
message ClaimRequest {
    string session_id = 1;
}

message ClaimResponse {
    string token = 1;
}

// Reclaim
message ReclaimRequest {
    string token = 1;
}

message ReclaimResponse {
    bool success = 1;
}

// Unclaim
message UnclaimRequest {
    string token = 1;
}

message UnclaimResponse {
    bool success = 1;
}

// GetMpmCompatNumber
message GetMpmCompatNumberRequest {}

message GetMpmCompatNumberResponse {
    repeated uint32 compat_num = 1;
}

// ListMethods
message ListMethodsRequest {}

message MethodInfo {
  string method_name = 1;
  string docstring = 2;
  bool requires_claim = 3;
}

message ListMethodsResponse {
  repeated MethodInfo methods = 1;
}

// ==============================================================================
// Device Initialization & Configuration Messages
// ==============================================================================

// Init
message InitRequest {
  string token = 1;
  StringMap args = 2;
}

message InitResponse {
  bool success = 1;
}

// ResetTimerAndMgr
message ResetTimerAndMgrRequest {
  string token = 1;
}

message ResetTimerAndMgrResponse {}

// UpdateComponent
message UpdateComponentRequest {
  string token = 1;
  repeated StringMap file_metadata_l = 2;
  repeated bytes data_l = 3;
}

message UpdateComponentResponse {
  bool success = 1;
}

// ListUpdateableComponents
message ListUpdateableComponentsRequest {
}

message ListUpdateableComponentsResponse {
  repeated string components = 1;
}

// GetComponentInfo
message GetComponentInfoRequest {
  string component_name = 1;
}

message GetComponentInfoResponse {
  StringMap metadata = 1;
}

message GetLogBufRequest {
    string token = 1;
}

message GetLogBufResponse {
    repeated StringMap log_bufs = 1;
}

message GetDeviceInfoRequest {}

message GetDeviceInfoResponse {
    StringMap dev_info = 1;
}

message GetDboardInfoRequest {}

message GetDboardInfoResponse {
    repeated StringMap dboard_info = 1;
}

// GetInitStatus
message GetInitStatusRequest {
  string token = 1;
}

message GetInitStatusResponse {
  repeated string init_status = 1;
}

// GetDeviceId
message GetDeviceIdRequest {
  string token = 1;
}

message GetDeviceIdResponse {
  uint32 device_id = 1;
}

// SetDeviceId
message SetDeviceIdRequest {
  string token = 1;
  uint32 device_id = 2;
}

message SetDeviceIdResponse {}

// SupportsFeature
message SupportsFeatureRequest {
  string token = 1;
  string query = 2;
}

message SupportsFeatureResponse {
  bool supported = 1;
}

// ==============================================================================
// Timing & Synchronization Messages
// ==============================================================================

// GetNumTimekeepers
message GetNumTimekeepersRequest {
  string token = 1;
}

message GetNumTimekeepersResponse {
  uint32 count = 1;
}

// SetTickPeriod
message SetTickPeriodRequest {
  string token = 1;
  uint32 tk_idx = 2;
  uint64 period_ns = 3;
}

message SetTickPeriodResponse {}

// GetTimekeeperTime
message GetTimekeeperTimeRequest {
  string token = 1;
  uint32 tk_idx = 2;
  bool last_pps = 3;
}

message GetTimekeeperTimeResponse {
  uint64 time = 1;
}

// SetTimekeeperTime
message SetTimekeeperTimeRequest {
  string token = 1;
  uint32 tk_idx = 2;
  uint64 ticks = 3;
  bool next_pps = 4;
}

message SetTimekeeperTimeResponse {}

// SetTimeSource
message SetTimeSourceRequest {
  string token = 1;
  string time_source = 2;
}

message SetTimeSourceResponse {}

// GetTimeSource
message GetTimeSourceRequest {
  string token = 1;
}

message GetTimeSourceResponse {
  string source = 1;
}

// GetTimeSources
message GetTimeSourcesRequest {
  string token = 1;
}

message GetTimeSourcesResponse {
  repeated string sources = 1;
}

// SetClockSource
message SetClockSourceRequest {
  string token = 1;
  string source = 2;
}

message SetClockSourceResponse {}

// GetClockSource
message GetClockSourceRequest {
  string token = 1;
}

message GetClockSourceResponse {
  string source = 1;
}

// GetClockSources
message GetClockSourcesRequest {
  string token = 1;
}

message GetClockSourcesResponse {
  repeated string sources = 1;
}

// SetSyncSource
message SetSyncSourceRequest {
  string token = 1;
  StringMap sync_args = 2;
}

message SetSyncSourceResponse {}

// GetSyncSource
message GetSyncSourceRequest {
  string token = 1;
}

message GetSyncSourceResponse {
  StringMap source = 1;
}

// GetSyncSources
message GetSyncSourcesRequest {
  string token = 1;
}

message GetSyncSourcesResponse {
  repeated StringMap sources = 1;
}

// SetClockSourceOut
message SetClockSourceOutRequest {
  string token = 1;
  bool enable = 2;
}

message SetClockSourceOutResponse {}

// SetTriggerIo
message SetTriggerIoRequest {
  string token = 1;
  string direction = 2;
}

message SetTriggerIoResponse {}

// GetClocks
message GetClocksRequest {
  string token = 1;
}

message GetClocksResponse {
  repeated StringMap clocks = 1;
}

// Synchronize
message SynchronizeRequest {
  string token = 1;
  StringMap sync_args = 2;
  bool finalize = 3;
}

message SynchronizeResponse {
  StringMap result = 1;
}

// AggregateSyncData
message AggregateSyncDataRequest {
  string token = 1;
  repeated StringMap collated_sync_data = 2;
}

message AggregateSyncDataResponse {
  StringMap result = 1;
}

// SetRefClkTuningWord
message SetRefClkTuningWordRequest {
  string token = 1;
  uint32 tuning_word = 2;
}

message SetRefClkTuningWordResponse {}

// GetRefClkTuningWord
message GetRefClkTuningWordRequest {
  string token = 1;
}

message GetRefClkTuningWordResponse {
  uint32 tuning_word = 1;
}

// StoreRefClkTuningWord
message StoreRefClkTuningWordRequest {
  string token = 1;
  uint32 tuning_word = 2;
}

message StoreRefClkTuningWordResponse {}

// ==============================================================================
// Sensor Messages
// ==============================================================================

// GetMbSensors
message GetMbSensorsRequest {
  string token = 1;
}

message GetMbSensorsResponse {
  repeated string sensors = 1;
}

// GetMbSensor
message GetMbSensorRequest {
  string token = 1;
  string sensor_name = 2;
}

message GetMbSensorResponse {
