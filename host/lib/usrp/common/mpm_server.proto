// SetUserEepromData — set dboard user EEPROM blobs (blob_id -> bytes)
message SetUserEepromDataRequest {
  uint32 db_idx = 1;
  string token = 2;
  BytesMap eeprom_data = 3;
}

message SetUserEepromDataResponse {}

// UpdateRefClockFreq — notify dboard of external reference clock freq change
message UpdateRefClockFreqRequest {
  uint32 db_idx = 1;
  string token = 2;
  double freq = 3;
}

message UpdateRefClockFreqResponse {}

// InitRfic — initialize AD9361 chains at the given master clock rate
message InitRficRequest {
  uint32 db_idx = 1;
  string token = 2;
  double master_clock_rate = 3;
}

message InitRficResponse {}

// TearDownRfic — de-initialize the AD9361 RFIC object
message TearDownRficRequest {
  uint32 db_idx = 1;
  string token = 2;
}

message TearDownRficResponse {}

// ResetClock — reset or re-enable a named clock (X4XX-specific)
// clock_to_reset: 'cpld', 'spll', or 'rpll'
// value: true = assert reset, false = release reset
message ResetClockRequest {
  string token = 1;
  bool value = 2;
  string clock_to_reset = 3;
}

message ResetClockResponse {}

