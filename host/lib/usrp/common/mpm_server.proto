  rpc DumpJesdCore(DumpJesdCoreRequest) returns (DumpJesdCoreResponse);
  rpc PeekDbCpld(PeekDbCpldRequest) returns (PeekDbCpldResponse);
  rpc PokeDbCpld(PokeDbCpldRequest) returns (PokeDbCpldResponse);
}

