  string token = 1;
}

message GetGpioBanksResponse {
  repeated string banks = 1;
}

// GetGpioSrcs
message GetGpioSrcsRequest {
  string token = 1;
  string bank = 2;
}

message GetGpioSrcsResponse {
  repeated string sources = 1;
}

// GetGpioSrc
message GetGpioSrcRequest {
  string token = 1;
  string bank = 2;
}

message GetGpioSrcResponse {
  repeated string sources = 1;
